name: iPhoneWebcam
options:
  bundleIdPrefix: com.webcam
targets:
  iPhoneWebcam:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
    settings:
      base:
        SWIFT_VERSION: "5.0"
    info:
      path: Info.plist
      properties:
        NSCameraUsageDescription: "Przechwytywanie obrazu z aparatu"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft

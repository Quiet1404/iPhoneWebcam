name: iPhoneWebcam
options:
  bundleIdPrefix: com.webcam
targets:
  iPhoneWebcam:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: iPhone Webcam Pro
        NSCameraUsageDescription: Camera access is required to stream 1080p 60 FPS video to your PC over USB.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}

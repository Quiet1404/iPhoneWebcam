name: iPhoneWebcam
options:
  bundleIdPrefix: com.webcam
targets:
  iPhoneWebcam:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        NSCameraUsageDescription: "Przechwytywanie obrazu z aparatu"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft

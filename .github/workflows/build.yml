name: Build iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project iPhoneWebcam.xcodeproj -scheme iPhoneWebcam -sdk iphoneos -configuration Release CONFIGURATION_BUILD_DIR=build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/iPhoneWebcam.app Payload/
          zip -r iPhoneWebcam.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iPhoneWebcam-IPA
          path: iPhoneWebcam.ipa
